# When FolderPath is empty or omitted, the user's Pictures folder is opened by default.
FolderPath = ""

# Initial thumbnail size on startup.
ThumbnailSize = 256
# Selection style: fill / bracket / border
SelectionStyle = "bracket"
# Keep the window always on top (can be toggled with Ctrl+T)
AlwaysOnTop = false
ShowFileNames = false

# SortBy values:
#   date  - Creation time
#   write - Last write time
#   size  - File size
#   ext   - Extension (then name)
#   name  - File name (default)
SortBy = "date"

SortDescending = true
FontName = "Maple Mono NL NF CN"
FontSize = 7.0

BackgroundColor = "#232526"
TextColor = "#ECE7EA"
SelectionColor = "#ECE7EA"
PlaceholderColor = "#232526"
StatusBarColor = "#232526"
# BackgroundColor = "#E9E9E9"
# TextColor = "#232425"
# SelectionColor = "#232526"
# PlaceholderColor = "#E9E9E9"
# StatusBarColor = "#E9E9E9"

FileNameHeight = 14
CellPadding = 6
StatusBarHeight = 22

# Ctrl+J / Ctrl+K cycles through the sizes defined in Presets.
[[Presets]]
Size = 16
Columns = 10
Rows = 16

[[Presets]]
Size = 48
Columns = 5
Rows = 10

[[Presets]]
Size = 96
Columns = 2
Rows = 6

[[Presets]]
Size = 256
Columns = 1
Rows = 3

ImageExtensions = [
  ".jpg",
  ".jpeg",
  ".png",
  ".gif",
  ".bmp",
  ".webp",
  ".tif",
  ".tiff",
  ".ico",
]
GdiSupportedExtensions = [
  ".jpg",
  ".jpeg",
  ".png",
  ".gif",
  ".bmp",
  ".tif",
  ".tiff",
  ".ico",
]
VideoExtensions = [
  ".mp4",
  ".mkv",
  ".avi",
  ".mov",
  ".wmv",
  ".webm",
  ".m4v",
  ".flv",
  ".mpeg",
  ".mpg",
]
